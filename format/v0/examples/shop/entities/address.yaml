id: address
name: 주소
physical:
  name: ADDRESS
attributes:
  - id: addr_no
    name: 주소번호
    domain: number
    nullable: false
    physical:
      name: ADDR_NO
  - id: cust_no
    name: 고객번호
    term: cust_no
    domain: number
    nullable: false
    physical:
      name: CUST_NO
    migratedFrom:
      - relationship: customer_has_address
        attribute: cust_no
  - id: zip_cd
    name: 우편번호
    domain: code
    physical:
      name: ZIP_CD
  - id: addr
    name: 주소
    type:
      base: string
      length: 200
    nullable: false
    physical:
      name: ADDR
keys:
  - id: pk
    kind: primary
    attributes:
      - addr_no
